<script>
// Menu masquable, état mémorisé
(() => {
  const KEY = 'uiHidden:' + location.pathname.split('/').pop();
  const set = h => { document.body.classList.toggle('ui-hidden', h); try { localStorage.setItem(KEY, h ? '1' : ''); } catch (e) {} setTimeout(() => window.dispatchEvent(new Event('resize')), 50); };
  try { if (localStorage.getItem(KEY)) document.body.classList.add('ui-hidden'); } catch (e) {}
  document.getElementById('hide-ui').onclick = () => set(true);
  document.getElementById('show-ui').onclick = () => set(false);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { loadLidar, fetchBuildings, fetchWater, inBuildings, merc } from './lidar.js';

const D = window.RoybonData, $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isTouch = matchMedia('(pointer: coarse)').matches;
const progress = (txt, p) => { $('#load-text').textContent = txt; if (p != null) $('#load-bar').style.width = Math.round(p * 100) + '%'; };
const warn = msg => { const w = $('#warn'); w.classList.remove('hidden'); w.innerHTML += (w.innerHTML ? '<br>' : '') + esc(msg); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

try {
// ---------- 1. Arbres, emprise, repère local ----------
progress('Chargement des arbres…', .04);
const { trees } = await D.loadTrees();
let lat0, lon0;
if (trees.length) { lat0 = trees.reduce((s, t) => s + t.lat, 0) / trees.length; lon0 = trees.reduce((s, t) => s + t.lon, 0) / trees.length; }
else { [lat0, lon0] = D.DEFAULT_CENTER; warn('Aucun arbre enregistré : affichage du terrain seul.'); }
const phi = lat0 * Math.PI / 180;
const mLat = 111132.954 - 559.822 * Math.cos(2 * phi) + 1.175 * Math.cos(4 * phi), mLon = 111412.84 * Math.cos(phi) - 93.5 * Math.cos(3 * phi);
const toLocal = (lat, lon) => ({ x: (lon - lon0) * mLon, z: -(lat - lat0) * mLat });
const toLatLon = (x, z) => [lat0 - z / mLat, lon0 + x / mLon];
let ext = 0; for (const t of trees) { const p = toLocal(t.lat, t.lon); ext = Math.max(ext, Math.abs(p.x), Math.abs(p.z)); }
const S = Math.ceil(Math.max(170, ext + 100));
const latMin = lat0 - S / mLat, latMax = lat0 + S / mLat, lonMin = lon0 - S / mLon, lonMax = lon0 + S / mLon;

// ---------- 2. Relief et végétation (LiDAR HD), bâtiments ----------
const size = clamp(Math.round(2 * S / .6), 384, 768);
const [lidar, buildings, water] = await Promise.all([
  loadLidar(latMin, lonMin, latMax, lonMax, size, t => progress(t, .15)),
  fetchBuildings(latMin, lonMin, latMax, lonMax).catch(e => { warn('Bâtiments IGN indisponibles.'); return []; }),
  fetchWater(latMin, lonMin, latMax, lonMax).catch(e => { warn('Cours d\'eau IGN indisponibles.'); return { areas: [], streams: [] }; }),
]);
progress('Analyse du relief…', .45);
let groundLL;
if (lidar.ok) groundLL = (lat, lon) => lidar.ground(lat, lon);
else {
  // Dernier recours : service d'altitude point par point (maillage grossier)
  warn('Relief détaillé indisponible : relief approché.');
  const N = 40, H = [];
  try {
    const pts = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) pts.push([latMax - (latMax - latMin) * i / (N - 1), lonMin + (lonMax - lonMin) * j / (N - 1)]);
    for (let k = 0; k < pts.length; k += 150) {
      const ch = pts.slice(k, k + 150);
      const r = await fetch(`https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon=${ch.map(p => p[1].toFixed(7)).join('|')}&lat=${ch.map(p => p[0].toFixed(7)).join('|')}&resource=ign_rge_alti_wld&zonly=true&delimiter=|`);
      for (const z of (await r.json()).elevations) H.push(typeof z === 'number' ? z : z.z);
      await sleep(220);
    }
  } catch (e) { H.length = 0; }
  if (H.length !== N * N) { H.length = 0; for (let k = 0; k < N * N; k++) H.push(0); warn('Relief indisponible : terrain plat.'); }
  groundLL = (lat, lon) => { const fi = clamp((latMax - lat) / (latMax - latMin) * (N - 1), 0, N - 1.001), fj = clamp((lon - lonMin) / (lonMax - lonMin) * (N - 1), 0, N - 1.001); const i = fi | 0, j = fj | 0, a = fi - i, b = fj - j; return H[i * N + j] * (1 - a) * (1 - b) + H[i * N + j + 1] * (1 - a) * b + H[(i + 1) * N + j] * a * (1 - b) + H[(i + 1) * N + j + 1] * a * b; };
}
let base = Infinity; for (let i = 0; i <= 20; i++) for (let j = 0; j <= 20; j++) base = Math.min(base, groundLL(latMin + (latMax - latMin) * i / 20, lonMin + (lonMax - lonMin) * j / 20));
const rawGround = (x, z) => groundLL(...toLatLon(x, z)) - base;

// ---------- Eau (BD TOPO) : étangs et cours d'eau, lit creusé dans le relief ----------
const pipL = (x, z, ring) => { let ins = false; for (let i = 0, k = ring.length - 1; i < ring.length; k = i++) { const a = ring[i], b = ring[k]; if ((a.z > z) !== (b.z > z) && x < (b.x - a.x) * (z - a.z) / (b.z - a.z) + a.x) ins = !ins; } return ins; };
const segDist = (x, z, a, b) => { const dx = b.x - a.x, dz = b.z - a.z, L2 = dx * dx + dz * dz || 1e-9, t = clamp(((x - a.x) * dx + (z - a.z) * dz) / L2, 0, 1); return [Math.hypot(x - a.x - t * dx, z - a.z - t * dz), t]; };
const lakes = [], streams = [];
for (const a of water.areas) {
  const ring = a.rings[0].map(([la, lo]) => toLocal(la, lo)); if (ring.length < 3) continue;
  const xs = ring.map(p => p.x), zs = ring.map(p => p.z), bb = [Math.min(...xs), Math.max(...xs), Math.min(...zs), Math.max(...zs)];
  if (bb[1] < -S * 1.3 || bb[0] > S * 1.3 || bb[3] < -S * 1.3 || bb[2] > S * 1.3) continue;
  const inside = []; for (let x = bb[0]; x <= bb[1]; x += 2) for (let z = bb[2]; z <= bb[3]; z += 2) if (pipL(x, z, ring)) inside.push(rawGround(x, z));
  const edge = ring.map(p => rawGround(p.x, p.z)).sort((m, n) => m - n);
  inside.sort((m, n) => m - n);
  const level = inside.length ? Math.min(inside[Math.floor(inside.length * .3)], edge[Math.floor(edge.length * .2)]) : edge[0];
  lakes.push({ ring, bb, level, name: a.name, nature: a.nature });
}
for (const st of water.streams) {
  const raw = st.coords.map(([la, lo]) => toLocal(la, lo)), pts = [];
  for (let i = 0; i < raw.length - 1; i++) { const a = raw[i], b = raw[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.z - a.z))); for (let k = 0; k < n; k++) pts.push({ x: a.x + (b.x - a.x) * k / n, z: a.z + (b.z - a.z) * k / n }); }
  if (raw.length) pts.push(raw[raw.length - 1]);
  const keep = pts.filter(p => Math.abs(p.x) < S * 1.2 && Math.abs(p.z) < S * 1.2); if (keep.length < 3) continue;
  const w = st.width;
  // Fond du lit : point le plus bas autour de l'axe, lissé le long du cours
  let h = keep.map(p => { let m = Infinity; for (const [dx, dz] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) m = Math.min(m, rawGround(p.x + dx * w / 2, p.z + dz * w / 2)); return m; });
  for (let pass = 0; pass < 3; pass++) h = h.map((_, i) => { let s2 = 0, n = 0; for (let k = -4; k <= 4; k++) { const v = h[i + k]; if (v != null) { s2 += v; n++; } } return s2 / n; });
  streams.push({ pts: keep, h, w, name: st.name });
}
// Index spatial des segments de cours d'eau (mailles de 10 m)
const SG = new Map(), sgKey = (i, j) => i * 100003 + j;
streams.forEach((st, si) => { for (let i = 0; i < st.pts.length - 1; i++) { const a = st.pts[i], b = st.pts[i + 1], r = st.w / 2 + 3; for (let gx = Math.floor((Math.min(a.x, b.x) - r) / 10); gx <= Math.floor((Math.max(a.x, b.x) + r) / 10); gx++) for (let gz = Math.floor((Math.min(a.z, b.z) - r) / 10); gz <= Math.floor((Math.max(a.z, b.z) + r) / 10); gz++) { const k = sgKey(gx, gz); if (!SG.has(k)) SG.set(k, []); SG.get(k).push([si, i]); } } });
function nearestStream(x, z) {
  let best = null; for (const [si, i] of SG.get(sgKey(Math.floor(x / 10), Math.floor(z / 10))) || []) { const st = streams[si], [d, t] = segDist(x, z, st.pts[i], st.pts[i + 1]); if (!best || d - st.w / 2 < best.d - best.w / 2) best = { d, w: st.w, h: st.h[i] + (st.h[i + 1] - st.h[i]) * t }; }
  return best;
}
const smooth01 = t => t * t * (3 - 2 * t);
function carve(x, z, y) {
  for (const L of lakes) {
    if (x < L.bb[0] || x > L.bb[1] || z < L.bb[2] || z > L.bb[3] || !pipL(x, z, L.ring)) continue;
    let dEdge = Infinity; for (let i = 0; i < L.ring.length; i++) dEdge = Math.min(dEdge, segDist(x, z, L.ring[i], L.ring[(i + 1) % L.ring.length])[0]);
    y = Math.min(y, L.level - .3 - 1.2 * clamp(dEdge / 4, 0, 1));
  }
  const ns = nearestStream(x, z);
  if (ns && ns.d < ns.w / 2 + 2.5) { const s2 = smooth01(clamp((ns.d - ns.w / 2) / 2.5, 0, 1)); y = Math.min(y, ns.h - .7) * (1 - s2) + y * s2; }

  const p = pick(e.clientX, e.clientY);
  if (p) { tip.textContent = `${D.name(p.s.t)} · ${Math.round(p.s.h)} m`; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.classList.remove('hidden'); renderer.domElement.style.cursor = 'pointer'; }
  else { tip.classList.add('hidden'); renderer.domElement.style.cursor = ''; }
});

// ---------- 8. Boucle ----------
const clock = new THREE.Clock(); let frame = 0;
function loop() {
  const dt = Math.min(.05, clock.getDelta()); U.time.value += dt;
  if (mode === 'orbit') orbit.update();
  else {
    const run = keys.ShiftLeft || keys.ShiftRight ? 9 : 3.5;
    const f = (keys.KeyW || keys.KeyZ || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
    const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.KeyQ || keys.ArrowLeft ? 1 : 0) + joy.x;
    const sp = run * dt * (isTouch ? 1.6 : 1);
    camera.position.x = clamp(camera.position.x + (-Math.sin(yaw) * f + Math.cos(yaw) * s) * sp, -S, S);
    camera.position.z = clamp(camera.position.z + (-Math.cos(yaw) * f - Math.sin(yaw) * s) * sp, -S, S);
    const target = groundAt(camera.position.x, camera.position.z) + EYE; camera.position.y += (target - camera.position.y) * Math.min(1, dt * 10);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    if (++frame % 6 === 0) { const p = pick(); if (p && p.dist < 45) { tip.textContent = `${D.name(p.s.t)} · ${Math.round(p.dist)} m`; tip.style.left = '50%'; tip.style.top = '50%'; tip.classList.remove('hidden'); } else tip.classList.add('hidden'); }
  }
  updateLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setMode('orbit', true);
// Cadrage programmable (vérifications automatiques) : cible lat/lon, distance, azimut et élévation en degrés
window.__view = (lat, lon, dist = 60, az = 30, el = 35) => { const t = toLocal(lat, lon), y = groundAt(t.x, t.z), a = az * Math.PI / 180, e = el * Math.PI / 180; orbit.target.set(t.x, y, t.z); camera.position.set(t.x + dist * Math.cos(e) * Math.sin(a), y + dist * Math.sin(e), t.z + dist * Math.cos(e) * Math.cos(a)); orbit.update(); };
progress('Prêt', 1); $('#loading').classList.add('hidden');
loop();
} catch (e) {
  console.error(e); progress('Erreur : ' + e.message);
}
</script>
